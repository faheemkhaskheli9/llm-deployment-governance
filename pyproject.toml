[project]
name = "llm-deployment-governance"
version = "0.1.0"
description = "LLM Deployment Approval Platform"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.0,<6.1",
    "psycopg2-binary>=2.9",
    "djangorestframework>=3.15",
    "celery>=5.4",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-django>=4.8"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "govplatform.settings"
django_find_project = false
pythonpath = ["src"]
python_files = ["test_*.py"]
testpaths = ["tests"]
